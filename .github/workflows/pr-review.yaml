name: Review Pull Request

# Thin wrapper: the logic lives in deputy (https://github.com/Krande/deputy). Its
# pr-review checks the PR (conventional title + exactly one release-* label),
# computes the next version for information, and posts/updates a single sticky
# comment. Config lives in deputy.toml at the repo root. Linting and the packaging
# build run in pr-checks.yaml.
#
# This replaces a call to a reusable workflow referenced by a MOVING ref, from a
# `pull_request_target` workflow that held `contents: write` and was handed every
# repo secret. deputy is pinned to an immutable tag -- the `uses:` ref is the pin,
# where Dependabot can see it -- receives only GITHUB_TOKEN, and does not need
# `contents: write`.
#
# pull_request_target so the job (and GITHUB_TOKEN) can comment and label even on
# fork PRs. It checks out the BASE ref only and never runs any PR-head code.
# `labeled` is a trigger as well as `unlabeled`, so adding a release label re-runs
# the check the PR is merged on.

on:
  pull_request_target:
    types: [opened, synchronize, edited, labeled, unlabeled]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: Check Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref (full history for the version calc)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}   # base branch — never the untrusted PR head
          fetch-depth: 0

      - name: Review the PR (checks + sticky comment); fails if a check fails
        uses: Krande/deputy@v0.9.0
        with:
          command: pr-review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          has-source-key: ${{ secrets.SOURCE_KEY != '' }}
