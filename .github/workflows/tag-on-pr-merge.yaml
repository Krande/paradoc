name: Create Tag on PR Merge

# Thin wrapper: the release decision and the semantic-release invocation live in
# deputy (https://github.com/Krande/deputy). On a merged PR it reads the release-*
# label and, when a release is warranted, bumps the version, creates a vX.Y.Z tag,
# pushes it, and cuts a GitHub Release.
#
# Version locations come from deputy.toml's [release] table: pyproject.toml and the
# frontend's package.json + package-lock.json are bumped together, so the python
# package and the frontend stay in lockstep.
#
# The GitHub Release is the whole release: conda-forge's paradoc feedstock builds
# from the tag's source archive, and nothing is published to PyPI. The previous
# release-on-new-tag / pre-release-dispatch workflows fanned out to publish jobs that
# this repo's config never enabled, so they are gone rather than ported.
#
# CRITICAL — the release commit + tag are pushed over SSH with the SOURCE_KEY deploy
# key, NOT the default GITHUB_TOKEN. GITHUB_TOKEN cannot push the version-bump commit
# to a protected main, and a GITHUB_TOKEN-pushed tag does not trigger other workflows
# (publish-image.yaml builds on tags). Wired via `remote.ignore_token_for_push` in
# deputy's defaults: semantic-release pushes over the `origin` remote the checkout
# points at (SSH + SOURCE_KEY) and uses GH_TOKEN only for the Release API call.
#
# Requirements:
#   * secrets.SOURCE_KEY — a deploy key with WRITE access to this repo.
#   * Do not enable "Do not allow bypassing the above settings" in branch
#     protection, or the deploy-key push is rejected and no tag is created.

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

# One release at a time, and never cancel one. For pull_request_target, github.sha
# is the BASE branch tip, so every PR closed against the same main commit shares it;
# a sha-keyed group with cancel-in-progress can kill the run that had the merge to
# release. Queue on a fixed key instead; the non-merged runs skip in ~1s.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (full history; deploy-key auth so the push bypasses protection and triggers CI)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}   # base branch (main) — the merge is already in
          fetch-depth: 0
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - name: Configure git identity for the release commit
        run: |
          git config user.name "semantic-release"
          git config user.email "semantic-release@users.noreply.github.com"

      - name: Tag + release per the PR's release label
        uses: Krande/deputy@v0.9.0
        with:
          command: tag-on-merge
          github-token: ${{ secrets.GITHUB_TOKEN }}
