name: ci-branch-tests


on: push

concurrency:
  group: paradoc-quick-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3 # https://github.com/prefix-dev/setup-pixi
        with:
          pixi-version: v0.68.0
          environments: test
          cache: true

      # tectonic (the Linux PDF engine) fetches the TeX packages a document needs on first use
      # into its per-user cache; without this, every run re-downloads them (~1 min of the PDF
      # test). Keyed on the lock, so a tectonic upgrade starts a fresh cache.
      - name: Cache tectonic's TeX files
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: tectonic-${{ runner.os }}-

      # The frontend tests drive Playwright's Chromium. ubuntu-latest is Ubuntu 26.04, which the
      # locked Playwright does not recognise: `playwright install` refuses it ("does not support
      # chromium on ubuntu26.04-x64"). Its Ubuntu 24.04 build runs there, and every system package
      # 24.04 needs for it is in 26.04's archive, so install that one, with those packages. Drop the
      # override once the lock has a Playwright that supports 26.04.
      - name: Playwright version
        if: runner.os == 'Linux'
        id: playwright
        run: echo "version=$(pixi run -e test python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's browsers
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright's Chromium and its system dependencies
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: pixi run -e test python -m playwright install --with-deps chromium

      - name: Runs Tests
        # Explicit env: the `test` task is also provided by the `e2e`
        # environment (it shares the `test` feature), so a bare
        # `pixi run test` is ambiguous. Serve/e2e-only tests skip
        # cleanly here via `pytest.importorskip` (fastapi/uvicorn).
        run: pixi run -e test test