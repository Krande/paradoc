name: ci-branch-tests


on: push

concurrency:
  group: paradoc-quick-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2 # https://github.com/prefix-dev/setup-pixi
        with:
          pixi-version: v0.68.0
          environments: test
          cache: true

      # tectonic (the Linux PDF engine) fetches the TeX packages a document needs on first use
      # into its per-user cache; without this, every run re-downloads them (~1 min of the PDF
      # test). Keyed on the lock, so a tectonic upgrade starts a fresh cache.
      - name: Cache tectonic's TeX files
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: tectonic-${{ runner.os }}-

      - name: Runs Tests
        # Explicit env: the `test` task is also provided by the `e2e`
        # environment (it shares the `test` feature), so a bare
        # `pixi run test` is ambiguous. Serve/e2e-only tests skip
        # cleanly here via `pytest.importorskip` (fastapi/uvicorn).
        run: pixi run -e test test